<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Brillo radial orgánico (luz solar suave de fondo) -->
    <radialGradient id="b" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF" stop-opacity=".6"/>
      <stop offset="60%" stop-color="#EADBC8" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#FBF9F6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Degradado para la estructura de la lupa (Tierra, Celeste y Oro) -->
    <linearGradient id="d" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#705C53"/> <!-- Arcilla / Tierra Pampa -->
      <stop offset="50%" stop-color="#7FA8CC"/> <!-- Celeste Pampeano -->
      <stop offset="100%" stop-color="#D4A359"/> <!-- Oro Mate de Mayo -->
    </linearGradient>
    
    <clipPath id="a">
      <circle cx="256" cy="240" r="168"/>
    </clipPath>
  </defs>

  <!-- Fondo General: Blanco Roto / Arena Muy Claro -->
  <rect width="512" height="512" rx="24" fill="#FBF9F6"/>

  <!-- Gráfico de Fondo (Bastones desaturados en armonía cálida) -->
  <g transform="translate(130 252)">
    <rect y="50" width="34" height="175" rx="8" fill="#D5CEA3"/>
    <rect x="66" y="16" width="34" height="209" rx="8" fill="#EADBC8"/> <!-- Trigo -->
    <rect x="132" y="37" width="34" height="188" rx="8" fill="#A0C4DF"/> <!-- Celeste Suave -->
    <rect x="198" y="1" width="34" height="224" rx="8" fill="#7FA8CC"/> <!-- Celeste Pampeano -->
    <rect x="264" y="-43" width="34" height="268" rx="8" fill="#D4A359"/> <!-- Oro Mate -->
  </g>

  <!-- Línea de Tendencia Externa: Oro Mate de Mayo -->
  <g fill="#D4A359" stroke="#D4A359">
    <path d="m130 241 66-39 68 21 66-41 80-80" fill="none" stroke-width="14" stroke-linejoin="round"/>
    <path d="m426.97 85.03-10.606 23.334-12.728-12.728Z" stroke-linecap="round" stroke-width="5"/>
    <g transform="translate(130 22)">
      <circle cy="219" r="9"/>
      <circle cx="66" cy="180" r="9"/>
      <circle cx="134" cy="201" r="9"/>
      <circle cx="200" cy="160" r="9"/>
    </g>
  </g>

  <!-- Contenido de la Lupa (Contraste enfocado para lectura técnica) -->
  <g clip-path="url(#a)">
    <!-- Interior de la lupa ligeramente más claro para simular cristal -->
    <circle cx="256" cy="240" r="168" fill="#FFFFFF"/>
    <g transform="translate(93.46 255.48)scale(1.29)">
      <rect y="50" width="34" height="175" rx="8" fill="#D5CEA3"/>
      <rect x="66" y="16" width="34" height="209" rx="8" fill="#EADBC8"/>
      <rect x="132" y="37" width="34" height="188" rx="8" fill="#A0C4DF"/>
      <rect x="198" y="1" width="34" height="224" rx="8" fill="#7FA8CC"/>
      <rect x="264" y="-43" width="34" height="268" rx="8" fill="#D4A359"/>
    </g>
    <!-- Línea de Tendencia Interna: Azul Federal para máximo contraste -->
    <g fill="#1E2A38" stroke="#1E2A38">
      <path d="m93.46 241.29 85.14-50.31 87.72 27.09 85.14-52.89 103.2-103.2" fill="none" stroke-width="18.06" stroke-linejoin="round"/>
      <path d="m476.551 40.089-13.681 30.1-16.42-16.419Z" stroke-linecap="round" stroke-width="6.45"/>
      <g transform="translate(93.46 -41.22)scale(1.29)">
        <circle cy="219" r="9"/>
        <circle cx="66" cy="180" r="9"/>
        <circle cx="134" cy="201" r="9"/>
        <circle cx="200" cy="160" r="9"/>
      </g>
    </g>
    <!-- Reflejo orgánico sobre el lente -->
    <circle cx="256" cy="240" r="168" fill="url(#b)"/>
  </g>

  <!-- Marco y Mango de la Lupa -->
  <g stroke-linecap="round">
    <!-- Sombras base sutiles en gris cálido en lugar de negro puro -->
    <circle cx="256" cy="240" r="180" fill="none" stroke="#EADBC8" stroke-width="34" transform="rotate(-15 256 240)"/>
    <path d="m383.28 367.28 70.71 70.71" stroke="#EADBC8" stroke-width="16"/>
    <path d="m411.563 395.563 70.711 70.711" stroke="#EADBC8" stroke-width="60"/>
    
    <!-- Cuerpo principal con el degradado de la Pampa -->
    <path d="m383.28 367.28 70.71 70.71" stroke="url(#d)" stroke-width="10"/>
    <path d="m411.563 395.563 70.711 70.711" stroke="url(#d)" stroke-width="40"/>
    <circle cx="256" cy="240" r="180" fill="none" stroke="url(#d)" stroke-width="20" transform="rotate(-15 256 240)"/>
  </g>
</svg>
